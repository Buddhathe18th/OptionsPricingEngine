name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 core risk api tests

      - name: Type check (mypy)
        run: mypy core risk api

      - name: Security scan (bandit)
        run: bandit -q -r core risk api

      - name: Test (pytest)
        run: pytest -q
